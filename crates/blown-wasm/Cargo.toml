[package]
name = "blown-wasm"
description = "BlownSim solver compiled to WebAssembly, so the live viewport runs it in a worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
blown-core = { path = "../blown-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
