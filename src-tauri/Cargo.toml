[package]
name = "blownsim"
version = "1.1.1"
description = "Simflate desktop app"
authors = ["Guy Armstrong"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "blownsim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
blown-core = { path = "../crates/blown-core", features = ["parallel"] }
blown-ref = { path = "../crates/blown-ref" }
blown-dwg = { path = "../crates/blown-dwg" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.3"
# Native message box when the app has to close on a crash (crash.rs).
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

# Paste from Illustrator / Word: their vector clipboard formats (Windows).
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
